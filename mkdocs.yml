site_name: starlette-permissions
site_description: Django-style permission classes for Starlette and FastAPI.
site_url: https://korolenkowork.github.io/starlette-permissions/
repo_url: https://github.com/korolenkowork/starlette-permissions
repo_name: starlette-permissions
edit_uri: edit/main/docs/

theme:
  name: material
  # Holds main.html, which injects the Google Search Console verification tag
  # into <head>. Material has no config field for arbitrary meta tags.
  custom_dir: overrides
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Writing permissions: permissions.md
      - Combining permissions: composition.md
      - Object-level permissions: object-permissions.md
      - Settings: settings.md
      - Testing: testing.md
  - Frameworks:
      - FastAPI: fastapi.md
      - Starlette: starlette.md
      - SQLAlchemy: sqlalchemy.md
  - Compatibility: compatibility.md
  - Migrating from DRF: migration-from-drf.md
  - API reference: api-reference.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra:
  # Google Analytics 4. The Measurement ID comes from the environment rather
  # than being committed: it is not a secret (it ships in the page anyway), but
  # keeping it out of the repo means local builds and PR previews do not report
  # into production stats.
  #
  # Set it in CI as the repository variable GOOGLE_ANALYTICS_KEY; see docs.yml.
  # With the variable unset, the `analytics` block in overrides/main.html skips
  # the tracker altogether, so local builds and `mkdocs serve` emit nothing.
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: Helpful
          data: 1
          note: Thanks for the feedback.
        - icon: material/thumb-down-outline
          name: Could be better
          data: 0
          note: >-
            Please <a href="https://github.com/korolenkowork/starlette-permissions/issues/new"
            target="_blank" rel="noopener">open an issue</a> describing what was missing.

  # gtag.js sets cookies, which needs consent in the EU/UK. Material's built-in
  # banner gates analytics behind it: with `actions: [accept, reject, manage]`
  # nothing is loaded until the visitor accepts.
  consent:
    title: Cookie consent
    description: >-
      This site uses cookies to measure which pages get read, so the
      documentation can be improved. Rejecting them leaves the site fully
      usable.
    actions: [accept, reject, manage]

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

watch:
  - src/starlette_permissions
