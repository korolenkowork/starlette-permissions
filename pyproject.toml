[project]
name = "starlette-permissions"
version = "0.1.0"
description = "Django-style permission classes for Starlette and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "korolenkowork", email = "enotshow275@gmail.com" }]
keywords = [
    "starlette",
    "fastapi",
    "permissions",
    "authorization",
    "django",
    "drf",
    "rbac",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Floor verified in CI by running the full suite against exactly these
# versions. 0.35 is where Route(middleware=...) landed, which the route-scoped
# guard documented in docs/starlette.md relies on.
#
# Deliberately uncapped at the top. The tested ceiling is pinned in CI (see the
# `ceiling` job) and published in docs/compatibility.md; an upper bound in the
# metadata itself would propagate into every downstream resolution and is far
# harder to undo than a stale docs line.
dependencies = ["starlette>=0.35"]

[project.optional-dependencies]
# FastAPI pins Starlette to a narrow range in every release, so the floor here
# has to be a version whose range overlaps ours: 0.110 is the first that allows
# Starlette >= 0.36.3. Anything older resolves to Starlette < 0.28.
fastapi = ["fastapi>=0.110"]

[project.urls]
Homepage = "https://github.com/korolenkowork/starlette-permissions"
Documentation = "https://korolenkowork.github.io/starlette-permissions/"
Repository = "https://github.com/korolenkowork/starlette-permissions"
Changelog = "https://github.com/korolenkowork/starlette-permissions/blob/main/CHANGELOG.md"
Issues = "https://github.com/korolenkowork/starlette-permissions/issues"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Poetry 2.x reads the standard [project] table above; this section only holds
# what PEP 621 has no field for.
packages = [{ include = "starlette_permissions", from = "src" }]
include = [{ path = "tests", format = "sdist" }]

# ---------------------------------------------------------------------------
# Development dependencies (poetry install --with dev,docs)
# ---------------------------------------------------------------------------

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
pytest-cov = ">=5.0"
fastapi = ">=0.100"
ruff = ">=0.6"
mypy = ">=1.11"
# Starlette's TestClient uses httpx below 1.0 and httpx2 from 1.0 onward;
# installing both lets the CI matrix cover the whole supported range.
httpx = ">=0.27"
httpx2 = { version = ">=0.1", python = ">=3.10" }
# For examples/sqlalchemy_app only. The library itself has no ORM dependency;
# the tests skip that module when these are absent.
sqlalchemy = { version = ">=2.0", extras = ["asyncio"] }
aiosqlite = ">=0.19"

[tool.poetry.group.docs.dependencies]
# Capped below 2.0: that release removes the plugin system outright, which
# would take mkdocstrings and the Material theme with it.
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"
mkdocstrings = { version = ">=0.26", extras = ["python"] }

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "default::DeprecationWarning",
    # Starlette's TestClient below 1.0 leaks the anyio memory object streams it
    # uses to drive lifespan. They surface from __del__ at an arbitrary later
    # point, so with -W error they fail whichever test the GC happens to land
    # on. Upstream, and gone on Starlette 1.x — the ceiling job runs without
    # this filter mattering. Deliberately matched on the exact message so a
    # genuine leak of our own would still fail.
    "ignore:Unclosed <MemoryObject:ResourceWarning",
]

[tool.coverage.run]
source = ["starlette_permissions"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Any is the honest annotation for a user-supplied object.
    "COM812",  # Conflicts with the formatter.
    "CPY001",  # The LICENSE file is the copyright notice.
    "D203",    # Mutually exclusive with D211.
    "D213",    # Mutually exclusive with D212.
    # The class docstring is the contract for a permission; repeating it on
    # every has_permission override and every __repr__ would be noise, and the
    # Google convention documents __init__ arguments on the class.
    "D102",
    "D105",
    "D107",
    "ARG002",  # Overridable hooks take arguments their default body ignores.
    "ARG004",
    "FBT001",  # Boolean keyword arguments are fine when keyword-only.
    "FBT002",
    "PLC0415", # Deferred imports keep FastAPI optional and break import cycles.
    "TRY003",  # Long, specific error messages are the point.
    "EM101",   # ...and inlining them reads better than a variable per message.
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",
    "ARG",
    "B008",   # Depends()-in-default is the FastAPI idiom being tested.
    "D",
    "FBT003",
    "INP001",
    "PLR2004",
    "PT011",
    "RUF012",
    "S101",
    "S105",   # Fixture API tokens are literals by design, not leaked secrets.
    "S106",
    "S603",   # Subprocess calls here run sys.executable with a literal script.
    "SLF001",
    "TC002",  # Annotations here are resolved at runtime by FastAPI.
]
"examples/*" = [
    "ANN",
    "ARG",
    "D",
    "INP001",
    "RUF012",
    "S105",   # Seed-data API tokens are literals by design.
    "S106",
    "T201",
    "TC002",  # FastAPI resolves endpoint annotations at runtime.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "starlette_permissions.requires",
    "starlette_permissions.dependencies.requires",
    "starlette_permissions.dependencies.requires_object",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
