name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the `upstream` job reports a breaking release from Starlette
    # or FastAPI within days rather than at the next release.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.1.3"
  # The highest versions the suite has actually been run against. Bump these
  # together with the table in docs/compatibility.md when the `upstream` job
  # reports a newer release passing.
  CEILING_STARLETTE: "1.6.0"
  CEILING_FASTAPI: "0.141.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==$POETRY_VERSION
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache: poetry
      - run: poetry install --with dev
      - name: Ruff (lint)
        run: poetry run ruff check .
      - name: Ruff (format)
        run: poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Spot-check other platforms on one interpreter rather than the grid.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry==$POETRY_VERSION
        shell: bash
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # cache: poetry
      - run: poetry install --with dev
      - name: Pytest
        run: poetry run pytest --cov --cov-report=xml -q
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  floor:
    name: floor (starlette 0.36.3, fastapi 0.110)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest pytest-asyncio "sqlalchemy[asyncio]>=2.0" aiosqlite
      - run: pip install "starlette==0.36.3" "fastapi==0.110.0" "httpx<0.28"
      - name: Confirm the pins actually took
        run: pip list | grep -E "^(starlette|fastapi) "
      - run: pytest -q

  ceiling:
    # The other end of the supported range, frozen. `test` above resolves
    # whatever is current, which is what catches breakage early; this job
    # asserts that the exact combination promised in docs/compatibility.md
    # keeps working, so the documented ceiling can never drift from reality.
    name: ceiling (frozen newest tested)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e . pytest pytest-asyncio httpx2 "sqlalchemy[asyncio]>=2.0" aiosqlite
      - name: Freeze Starlette and FastAPI
        run: |
          pip install \
            "starlette==${CEILING_STARLETTE}" \
            "fastapi==${CEILING_FASTAPI}"
      - name: Confirm the pins actually took
        run: |
          pip list | grep -E "^(starlette|fastapi) "
          python - <<'PY'
          import importlib.metadata as md, os, sys
          for pkg, key in (("starlette", "CEILING_STARLETTE"), ("fastapi", "CEILING_FASTAPI")):
              want, got = os.environ[key], md.version(pkg)
              if want != got:
                  sys.exit(f"{pkg}: pinned {want} but resolved {got}")
          print("pins verified")
          PY
      - run: pytest -q

  upstream:
    # Non-blocking early warning. Runs against whatever PyPI serves today and
    # reports when the frozen ceiling has fallen behind, so the bump is a
    # deliberate change with a passing run behind it rather than a surprise.
    name: upstream (latest, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[fastapi]" pytest pytest-asyncio httpx2
      - name: Upgrade to the latest releases
        run: pip install --upgrade starlette fastapi
      - name: Report drift from the frozen ceiling
        run: |
          LATEST_S=$(python -c "import importlib.metadata as m; print(m.version('starlette'))")
          LATEST_F=$(python -c "import importlib.metadata as m; print(m.version('fastapi'))")
          echo "latest: starlette $LATEST_S, fastapi $LATEST_F"
          echo "frozen: starlette $CEILING_STARLETTE, fastapi $CEILING_FASTAPI"
          if [ "$LATEST_S" != "$CEILING_STARLETTE" ] || [ "$LATEST_F" != "$CEILING_FASTAPI" ]; then
            echo "::warning::Newer releases available (starlette $LATEST_S, fastapi $LATEST_F). If this job's tests passed, bump CEILING_* in ci.yml and the table in docs/compatibility.md."
          fi
      - run: pytest -q

  starlette-only:
    # Guards the claim that FastAPI is optional. Nothing in the core may import
    # it, and the Starlette-only integration points must work without it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # httpx2 backs Starlette's TestClient from 1.0 onward; on older
      # Starlette, swap this for "httpx<0.28".
      - run: pip install -e . pytest pytest-asyncio httpx2
      - name: Assert FastAPI is absent
        run: |
          pip uninstall -y fastapi 2>/dev/null || true
          if pip show fastapi >/dev/null 2>&1; then
            echo "::error::fastapi is installed; this job must run without it"
            exit 1
          fi
      - name: Import without FastAPI
        run: python -c "import starlette_permissions, sys; assert 'fastapi' not in sys.modules"
      - name: Run the framework-agnostic tests
        # The excluded modules test the FastAPI integration itself and import
        # it directly; everything else must pass with Starlette alone. The
        # SQLAlchemy example skips itself here, since sqlalchemy is not
        # installed — no --ignore needed, and the skip proves the library
        # carries no ORM dependency.
        run: |
          pytest -q \
            --ignore=tests/test_fastapi.py \
            --ignore=tests/test_examples.py \
            --ignore=tests/test_compat.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==$POETRY_VERSION
      - run: poetry build
      - name: Check metadata
        run: |
          pipx install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

